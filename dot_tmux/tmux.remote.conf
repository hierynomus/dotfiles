# Sourced by ~/.tmux.conf when tmux detects it's running inside an SSH
# session (referenced by the original dotmac config but never actually
# checked in — this is a minimal working version of it).
#
# Just gives a remote/nested session a visibly different status bar color
# so it's obvious at a glance which tmux you're driving.
set -g status-style "fg=colour253,bg=colour88"
set -g pane-active-border-style "fg=colour88"

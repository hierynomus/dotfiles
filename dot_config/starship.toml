# Starship config — an alternate to Powerlevel10k (dot_p10k.zsh). Switch
# between them with the `prompt-backend` shell function
# (dot_config/zsh/functions.zsh); PROMPT_BACKEND in .zshrc reads the choice
# back on the next shell.
#
# Base: starship's built-in "catppuccin-powerline" preset
# (https://starship.rs/presets/catppuccin-powerline), Mocha flavor — matches
# the Catppuccin Mocha theme Ghostty and VS Code already use
# (dot_config/ghostty/config.tmpl, Code/User/settings.json.tmpl). Kept
# verbatim except for the extra segments spliced into the powerline chain
# below: mise-pinned runtimes the preset's own language modules don't cover,
# kubernetes/cloud context, and background jobs/exit status — mauve and pink
# were unused by the preset itself, so those get the new segments.
#
# To pull a fresh copy of the preset (e.g. after a starship upgrade adds
# something new) and re-diff by hand:
#   starship preset catppuccin-powerline
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
${custom.mise}\
[](fg:green bg:mauve)\
$kubernetes\
$terraform\
$aws\
$azure\
$gcloud\
$nix_shell\
[](fg:mauve bg:pink)\
$jobs\
$status\
[](fg:pink bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

# Extra mise-pinned runtimes the language modules above don't cover (ruby,
# elixir, erlang, dotnet, swift, zig, deno) — same "walk up, run `mise ls
# --local`" logic as the removed p10k `prompt_mise` segment (dot_p10k.zsh),
# capped at 3 with a "+N" suffix. `when` and `command` share the same
# relevance check (see dot_config/starship/mise-prompt.sh) so they can't
# disagree — a custom module with both set still shows a bare $symbol once
# `when` passes even if `command` then exits non-zero.
[custom.mise]
description = "mise-pinned runtimes not already shown by the modules above"
when = "$HOME/.config/starship/mise-prompt.sh --check --extra"
command = "$HOME/.config/starship/mise-prompt.sh --extra"
shell = ["bash", "--noprofile", "--norc"]
symbol = "⬢"
style = "bg:green"
format = '[[ $symbol( $output) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[kubernetes]
disabled = false
style = "bg:mauve"
format = '[[ $symbol$context ](fg:crust bg:mauve)]($style)'

[terraform]
style = "bg:mauve"
format = '[[ $symbol$workspace ](fg:crust bg:mauve)]($style)'

[aws]
style = "bg:mauve"
format = '[[ $symbol$profile ](fg:crust bg:mauve)]($style)'

[azure]
style = "bg:mauve"
format = '[[ $symbol$subscription ](fg:crust bg:mauve)]($style)'

[gcloud]
style = "bg:mauve"
format = '[[ $symbol$account ](fg:crust bg:mauve)]($style)'

[nix_shell]
style = "bg:mauve"
format = '[[ $symbol$state ](fg:crust bg:mauve)]($style)'

[jobs]
style = "bg:pink"
format = '[[ $symbol$number ](fg:crust bg:pink)]($style)'

[status]
disabled = false
style = "bg:pink"
format = '[[ $symbol$status ](fg:crust bg:pink)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
